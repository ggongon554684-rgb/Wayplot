<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https:">
  <title>WayPlot Parcel Map</title>
  <link rel="stylesheet" href="../leaflet/leaflet.css">
  <link rel="stylesheet" href="map.css">
  <script defer src="../leaflet/leaflet.js"></script>
  <script defer src="map.js"></script>
</head>
<body>
  <div id="map" role="application" aria-label="Parcel map">
    <div id="offline-note" class="map-note" hidden>Map background unavailable; parcel locations are still shown.</div>
    <div id="map-note" class="map-note" hidden></div>
    <div id="map-message" hidden></div>
  </div>
</body>
</html>
